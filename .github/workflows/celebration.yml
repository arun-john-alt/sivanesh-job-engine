name: Publish celebration page
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build.py'
      - '.github/workflows/celebration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: celebration-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build public page
        run: |
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
          node scripts/validate.mjs
          python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish celebration
        id: deployment
        uses: actions/deploy-pages@v4
