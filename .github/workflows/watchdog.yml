name: Recovery watchdog
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: recovery-watchdog
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: arun-john-alt/nixon-job-engine
          ref: main
          path: .shared-engine
          persist-credentials: false
      - name: Recover stale discovery or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .shared-engine/shared/watchdog.py --repo "${{ github.repository }}"
