<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find jobs, track applications and tailor your resume.">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Nextmove — Jobs & applications</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<aside class="sidebar">
  <a class="brand" href="#" data-view="jobs"><span class="brand-icon" aria-hidden="true">↗</span><b>nextmove<span>.</span></b></a>
  <nav aria-label="Main navigation">
    <button class="nav-item active" data-view="jobs"><span class="nav-icon" aria-hidden="true">▦</span><span>Jobs</span><span id="navCount" class="nav-count">0</span></button>
    <button class="nav-item" data-view="pipeline"><span class="nav-icon" aria-hidden="true">☷</span><span>Saved</span></button>
    <button class="nav-item" data-view="resume"><span class="nav-icon" aria-hidden="true">▤</span><span>Resume</span></button>
    <button class="nav-item" data-view="sources"><span class="nav-icon" aria-hidden="true">◉</span><span>Sources</span></button>
    <button class="nav-item" data-view="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span></button>
  </nav>
  <div class="sidebar-goal"><small>YOUR SEARCH</small><p id="sideGoal"></p><span id="sideDays"></span></div>
  <div class="sidebar-foot"><span>Make your next move.</span><button id="themeBtn" title="Switch theme" aria-label="Switch theme">◐</button></div>
</aside>
<main id="main" class="main" tabindex="-1">
  <header class="topbar"><div class="breadcrumb"><span class="mobile-brand">nextmove.</span><b id="pageName">Jobs</b></div><div class="top-actions"><span id="saveState" class="save-state">Saved on this device</span><button class="button icon-button" data-action="reload" title="Refresh published jobs" aria-label="Refresh jobs">↻</button><button class="button compact" data-action="workspace-import">Import profile</button></div></header>
  <div id="app"><div class="loading">Loading jobs…</div></div>
  <footer class="footer"><span id="dataStamp">Loading dataset</span><span>Your notes stay on this device.</span></footer>
</main>
<input type="file" id="fileInput" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="passDialog"><form method="dialog"><h2 id="passTitle">Protect your workspace</h2><p>Your passphrase is not stored. Use a long, unique phrase and share it separately.</p><label for="passphrase">Passphrase</label><input id="passphrase" type="password" minlength="12" autocomplete="off" required><div class="dialog-actions"><button value="cancel" class="button" formnovalidate>Cancel</button><button value="confirm" class="button primary">Continue</button></div></form></dialog>
<noscript>This application requires JavaScript. Job research is also available in data/jobs.json.</noscript>
<script type="module" src="app.js"></script>
</body></html>
